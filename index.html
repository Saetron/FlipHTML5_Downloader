<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FlipHTML5 Downloader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://static.fliphtml5.com/resourceFiles/html5_templates/js/deString.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #23272f;
        color: #e0e0e0;
        font-family: "Roboto", Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: #2c313a;
        border-radius: 18px;
        box-shadow: 0 6px 32px #0008;
        padding: 6vw 5vw;
        width: 96vw;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        margin: 0 auto;
      }
      h2 {
        color: #90caf9;
        font-weight: 500;
        margin-bottom: 2em;
        text-align: center;
        letter-spacing: 1px;
        font-size: 2em;
      }
      label {
        font-size: 1.2em;
        margin-bottom: 0.7em;
        color: #b0bec5;
        font-weight: 400;
      }
      input[type="text"] {
        background: #23272f;
        color: #e0e0e0;
        border: 1.5px solid #424242;
        border-radius: 8px;
        padding: 1.2em;
        font-size: 1.2em;
        width: 100%;
        margin-bottom: 1.5em;
        outline: none;
        transition: border-color 0.2s;
        box-sizing: border-box;
        font-family: inherit;
      }
      input[type="text"]:focus {
        border-color: #90caf9;
      }
      button {
        background: #1976d2;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 1.2em 0;
        font-size: 1.3em;
        font-weight: 500;
        cursor: pointer;
        margin-bottom: 1.5em;
        box-shadow: 0 2px 8px #0003;
        transition: background 0.2s, opacity 0.2s;
        width: 100%;
        font-family: inherit;
      }
      button:hover:not(:disabled),
      button:focus:not(:disabled) {
        background: #1565c0;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #status {
        margin-top: 0.5em;
        background: #23272f;
        color: #90caf9;
        border-radius: 8px;
        padding: 1.2em;
        min-height: 2.5em;
        font-size: 1.15em;
        box-shadow: 0 1px 4px #0002;
        text-align: center;
        word-break: break-word;
      }
      @media (max-width: 600px) {
        .container {
          padding: 8vw 2vw;
          max-width: 95vw;
          border-radius: 12px;
          box-shadow: 0 2px 8px #0003;
          margin: 4vw auto;
        }
        h2 {
          font-size: 2.3em;
          margin-bottom: 2em;
        }
        label {
          font-size: 1.3em;
        }
        input[type="text"] {
          font-size: 1.3em;
          padding: 1.5em;
          margin-bottom: 2em;
          height: 3.5em;
        }
        button {
          font-size: 1.3em;
          padding: 1.5em 0;
          height: 3.5em;
        }
        #status {
          font-size: 1.2em;
          padding: 1.5em;
          min-height: 3em;
          margin-top: 2em;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>FlipHTML5 Downloader</h2>
      <label for="url">FlipHTML5 URL:</label>
      <input
        type="text"
        id="url"
        placeholder="Enter FlipHTML5 URL"
        autocomplete="off"
      />
      <button id="downloadBtn" onclick="downloadFlipbook()">Download as CBZ</button>
      <div id="status"></div>
    </div>
    <script>
      function detectImageFormat(bytes) {
        if (bytes.length < 4) return null;
        if (bytes[0] === 0xff && bytes[1] === 0xd8) return "jpg";
        if (
          bytes[0] === 0x89 &&
          bytes[1] === 0x50 &&
          bytes[2] === 0x4e &&
          bytes[3] === 0x47
        )
          return "png";
        if (
          bytes.length >= 12 &&
          bytes[0] === 0x52 &&
          bytes[1] === 0x49 &&
          bytes[2] === 0x46 &&
          bytes[3] === 0x46 &&
          bytes[8] === 0x57 &&
          bytes[9] === 0x45 &&
          bytes[10] === 0x42 &&
          bytes[11] === 0x50
        ) {
          return "webp";
        }
        if (bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46)
          return "gif";
        return null;
      }

      async function ensureDeStringReady() {
        if (window.Module && window.Module.isReady && window.Module._DeString)
          return true;
        if (!document.querySelector('script[src*="deString.js"]')) {
          const s = document.createElement("script");
          s.src =
            "https://static.fliphtml5.com/resourceFiles/html5_templates/js/deString.js";
          document.head.appendChild(s);
        }
        for (let i = 0; i < 60; i++) {
          await new Promise((r) => setTimeout(r, 100));
          if (window.Module && window.Module.isReady && window.Module._DeString)
            return true;
        }
        return false;
      }

      function decryptFliphtml5String(encryptedStr) {
        const encoder = new TextEncoder();
        const bytes = encoder.encode(encryptedStr);
        const inPtr = window.Module._malloc(bytes.length + 1);
        window.Module.HEAPU8.set(bytes, inPtr);
        window.Module.HEAPU8[inPtr + bytes.length] = 0;

        const outPtr = window.Module._DeString(inPtr);
        let str = "";
        if (typeof window.UTF8ToString === "function") {
          str = window.UTF8ToString(outPtr);
        } else {
          let end = outPtr;
          while (window.Module.HEAPU8[end] !== 0) end++;
          str = new TextDecoder().decode(
            window.Module.HEAPU8.subarray(outPtr, end),
          );
        }
        window.Module._FreeMemory(outPtr);
        window.Module._free(inPtr);
        return str;
      }

      async function downloadFlipbook() {
        const urlInput = document.getElementById("url");
        const downloadBtn = document.getElementById("downloadBtn");
        const status = document.getElementById("status");
        const url = urlInput.value.trim();

        status.textContent = "Checking URL...";

        const m = url.match(
          /^https?:\/\/online\.fliphtml5\.com\/([^/?#]+)\/([^/?#]+)/i,
        );
        if (!m) {
          status.textContent = "Invalid FlipHTML5 URL format.";
          return;
        }
        const base = m[1];
        const book = m[2];
        const bookRoot = `https://online.fliphtml5.com/${base}/${book}/`;

        downloadBtn.disabled = true;

        try {
          let cbzName = book;
          let indexHtml = "";

          status.textContent = "Fetching book details...";
          try {
            const resp = await fetch(`${bookRoot}index.html`);
            if (resp.ok) {
              indexHtml = await resp.text();
              const titleMatch = indexHtml.match(/<title>(.*?)<\/title>/i);
              if (titleMatch && titleMatch[1]) {
                const decoded = titleMatch[1]
                  .replace(/&amp;/g, "&")
                  .replace(/&lt;/g, "<")
                  .replace(/&gt;/g, ">")
                  .replace(/&quot;/g, '"')
                  .replace(/&#39;/g, "'");
                const cleanTitle = decoded.replace(/[\\/:*?"<>|]/g, "").trim();
                if (cleanTitle) cbzName = cleanTitle;
              }
            }
          } catch (e) {
            console.warn("Could not fetch index.html:", e);
          }

          status.textContent = "Fetching book configuration...";
          let pageList = [];

          try {
            let configUrl = `${bookRoot}javascript/config.js`;
            const cfgMatch = indexHtml.match(
              /src=["']([^"']*javascript\/config\.js[^"']*)["']/i,
            );
            if (cfgMatch && cfgMatch[1]) {
              configUrl = new URL(cfgMatch[1], bookRoot).href;
            }
            const cfgResp = await fetch(configUrl);
            if (cfgResp.ok) {
              const cfgText = await cfgResp.text();
              const fn = new Function(
                cfgText +
                  "; return typeof htmlConfig !== 'undefined' ? htmlConfig : null;",
              );
              const htmlConfig = fn();
              if (htmlConfig && htmlConfig.fliphtml5_pages) {
                if (typeof htmlConfig.fliphtml5_pages === "string") {
                  status.textContent = "Decrypting page list...";
                  const ready = await ensureDeStringReady();
                  if (ready) {
                    const decrypted = decryptFliphtml5String(
                      htmlConfig.fliphtml5_pages,
                    );
                    const lastBracket = decrypted.lastIndexOf("]");
                    if (lastBracket !== -1) {
                      pageList = JSON.parse(
                        decrypted.substring(0, lastBracket + 1),
                      );
                    }
                  }
                } else if (Array.isArray(htmlConfig.fliphtml5_pages)) {
                  pageList = htmlConfig.fliphtml5_pages;
                }
              }
            }
          } catch (e) {
            console.warn("Could not load or decrypt config.js:", e);
          }

          const zip = new JSZip();
          let downloaded = 0;

          if (pageList && pageList.length > 0) {
            for (let i = 0; i < pageList.length; i++) {
              const p = pageList[i];
              const pageNum = i + 1;
              status.textContent = `Downloading page ${pageNum} of ${pageList.length}...`;

              const file = Array.isArray(p.n)
                ? p.n[0]
                : p.n ||
                  (Array.isArray(p.l)
                    ? p.l[0]
                    : p.l || (Array.isArray(p.t) ? p.t[0] : p.t));
              if (!file) continue;

              const candidates = [];
              if (file.startsWith("http://") || file.startsWith("https://")) {
                candidates.push(file);
              } else if (
                file.startsWith("files/") ||
                file.startsWith("./files/")
              ) {
                candidates.push(bookRoot + file.replace(/^\.\//, ""));
              } else {
                candidates.push(`${bookRoot}files/large/${file}`);
                candidates.push(`${bookRoot}files/page/${file}`);
                candidates.push(`${bookRoot}files/thumb/${file}`);
              }

              let pageDownloaded = false;
              for (const imgUrl of candidates) {
                try {
                  const resp = await fetch(imgUrl);
                  if (!resp.ok) continue;
                  const arr = await resp.arrayBuffer();
                  const bytes = new Uint8Array(arr);
                  const format = detectImageFormat(bytes);
                  if (!format) continue;

                  zip.file(`${String(pageNum).padStart(3, "0")}.${format}`, arr);
                  downloaded++;
                  pageDownloaded = true;
                  break;
                } catch (err) {
                  console.warn(`Error fetching ${imgUrl}:`, err);
                }
              }

              if (!pageDownloaded) {
                console.warn(`Could not download page ${pageNum}`);
              }
            }
          } else {
            for (let page = 1; page <= 500; page++) {
              status.textContent = `Downloading page ${page}...`;
              const candidates = [
                `${bookRoot}files/large/${page}.jpg`,
                `${bookRoot}files/large/${page}.webp`,
                `${bookRoot}files/page/${page}.jpg`,
                `${bookRoot}files/page/${page}.webp`,
                `${bookRoot}files/page/${page}.png`,
              ];

              let pageDownloaded = false;
              for (const imgUrl of candidates) {
                try {
                  const resp = await fetch(imgUrl);
                  if (!resp.ok) continue;
                  const arr = await resp.arrayBuffer();
                  const bytes = new Uint8Array(arr);
                  const format = detectImageFormat(bytes);
                  if (!format) continue;

                  zip.file(
                    `${String(page).padStart(3, "0")}.${format}`,
                    arr,
                  );
                  downloaded++;
                  pageDownloaded = true;
                  break;
                } catch (e) {
                  break;
                }
              }

              if (!pageDownloaded) {
                break;
              }
            }
          }

          if (downloaded === 0) {
            status.textContent =
              "No images downloaded. Please verify the URL or book visibility.";
            return;
          }

          status.textContent = "Creating CBZ file...";
          const cbzBlob = await zip.generateAsync({
            type: "blob",
            mimeType: "application/octet-stream",
          });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(cbzBlob);
          link.download = `${cbzName}.cbz`;
          link.click();
          status.textContent = `Downloaded ${downloaded} pages and created ${cbzName}.cbz`;
        } catch (err) {
          status.textContent = `An error occurred: ${err.message || err}`;
        } finally {
          downloadBtn.disabled = false;
        }
      }
    </script>
  </body>
</html>
